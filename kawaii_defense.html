    class Particle{
        constructor(x,y,vx,vy,color,life,size,type='star'){
            this.x=x;this.y=y;this.vx=vx;this.vy=vy;this.color=color;
            this.life=life;this.maxLife=life;this.size=size;this.type=type;
            this.rot=Math.random()*Math.PI*2;this.rotS=(Math.random()-.5)*8;
        }
        update(dt){this.x+=this.vx*dt;this.y+=this.vy*dt;this.vy+=30*dt;this.vx*=.97;this.life-=dt;this.rot+=this.rotS*dt;}
        get isDead(){return this.life<=0;}
        draw(ctx){
            const a=Math.max(0,this.life/this.maxLife),s=this.size*(.5+a*.5);
            ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.globalAlpha=a;ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=8;
            if(this.type==='heart'){ctx.beginPath();ctx.moveTo(0,s*.3);ctx.bezierCurveTo(-s,-s*.5,-s*.5,-s,0,-s*.4);ctx.bezierCurveTo(s*.5,-s,s,-s*.5,0,s*.3);ctx.fill();}
            else if(this.type==='star'){ctx.beginPath();for(let i=0;i<5;i++){const a2=(Math.PI*2/5)*i-Math.PI/2;ctx.lineTo(Math.cos(a2)*s,Math.sin(a2)*s);const ia=a2+Math.PI/5;ctx.lineTo(Math.cos(ia)*s*.4,Math.sin(ia)*s*.4);}ctx.closePath();ctx.fill();}
            else if(this.type==='sparkle'){ctx.beginPath();ctx.moveTo(0,-s);ctx.lineTo(s*.2,-s*.2);ctx.lineTo(s,0);ctx.lineTo(s*.2,s*.2);ctx.lineTo(0,s);ctx.lineTo(-s*.2,s*.2);ctx.lineTo(-s,0);ctx.lineTo(-s*.2,-s*.2);ctx.closePath();ctx.fill();}
            else{ctx.beginPath();ctx.arc(0,0,s,0,Math.PI*2);ctx.fill();}
            ctx.restore();
        }
    }

    class AOEEffect{
        constructor(x,y,r,c){this.x=x;this.y=y;this.maxR=r;this.color=c;this.life=.45;this.maxLife=.45;}
        update(dt){this.life-=dt;}get isDead(){return this.life<=0;}
        draw(ctx){
            const p=1-this.life/this.maxLife,r=this.maxR*p,a=(1-p)*.5;
            ctx.save();ctx.globalAlpha=a;
            const g=ctx.createRadialGradient(this.x,this.y,0,this.x,this.y,r);
            g.addColorStop(0,this.color+'44');g.addColorStop(1,this.color+'00');
            ctx.fillStyle=g;ctx.beginPath();ctx.arc(this.x,this.y,r,0,Math.PI*2);ctx.fill();
            ctx.strokeStyle=this.color;ctx.lineWidth=2*(1-p)+1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(this.x,this.y,r,0,Math.PI*2);ctx.stroke();ctx.setLineDash([]);
            ctx.restore();
        }
    }

    class BeamEffect{
        constructor(x1,y1,x2,y2,c){this.x1=x1;this.y1=y1;this.x2=x2;this.y2=y2;this.color=c;this.life=.3;this.maxLife=.3;}
        update(dt){this.life-=dt;}get isDead(){return this.life<=0;}
        draw(ctx){
            const a=this.life/this.maxLife;ctx.save();
            ctx.globalAlpha=a*.3;ctx.strokeStyle=this.color;ctx.lineWidth=10;ctx.lineCap='round';ctx.shadowColor=this.color;ctx.shadowBlur=20;
            ctx.beginPath();ctx.moveTo(this.x1,this.y1);ctx.lineTo(this.x2,this.y2);ctx.stroke();
            ctx.globalAlpha=a*.9;ctx.strokeStyle='#fff';ctx.lineWidth=2.5;ctx.shadowBlur=10;
            ctx.beginPath();ctx.moveTo(this.x1,this.y1);ctx.lineTo(this.x2,this.y2);ctx.stroke();
            ctx.restore();
        }
    }

    class FloatingText{
        constructor(x,y,text,color,size=14){this.x=x;this.y=y;this.text=text;this.color=color;this.size=size;this.life=1;this.maxLife=1;this.vy=-40;}
        update(dt){this.y+=this.vy*dt;this.vy*=.95;this.life-=dt;}get isDead(){return this.life<=0;}
        draw(ctx){const a=Math.max(0,this.life/this.maxLife);ctx.save();ctx.globalAlpha=a;ctx.font=`bold ${this.size}px Nunito,sans-serif`;ctx.textAlign='center';ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=8;ctx.fillText(this.text,this.x,this.y);ctx.restore();}
    }

    // ==================== CLASSE ENNEMI ====================

    class Enemy{
        constructor(type,world){
            const def=ENEMY_SHAPES[type],pal=world.enemyPalette[type];
            this.type=type;this.shape=def.shape;
            this.maxHp=Math.round(def.hp*world.hpMult);this.hp=this.maxHp;
            this.baseSpeed=def.speed*world.speedMult;this.speed=this.baseSpeed;
            this.reward=Math.round(def.reward*world.rewardMult);this.scoreValue=def.score;
            this.color=pal.c;this.glowColor=pal.g;this.eyeColor=pal.e;this.size=def.size;
            this.x=WAYPOINTS[0].x;this.y=WAYPOINTS[0].y;this.wpIdx=1;this.distTrav=0;
            this.dead=false;this.reachedEnd=false;this.hitFlash=0;
            this.bounce=Math.random()*Math.PI*2;this.blinkT=Math.random()*3+1;this.blink=false;
        }
        update(dt){
            if(this.dead||this.reachedEnd)return;
            if(this.hitFlash>0)this.hitFlash-=dt*5;
            this.bounce+=dt*6;this.blinkT-=dt;
            if(this.blinkT<=0){this.blink=!this.blink;this.blinkT=this.blink?.15:2+Math.random()*3;}
            const t=WAYPOINTS[this.wpIdx],dx=t.x-this.x,dy=t.y-this.y,d=Math.hypot(dx,dy),m=this.speed*dt;
            if(d<=m){this.x=t.x;this.y=t.y;this.distTrav+=d;this.wpIdx++;if(this.wpIdx>=WAYPOINTS.length)this.reachedEnd=true;}
            else{this.x+=dx/d*m;this.y+=dy/d*m;this.distTrav+=m;}
        }
        takeDamage(a){this.hp-=a;this.hitFlash=1;if(this.hp<=0){this.hp=0;this.dead=true;}}
        get isGone(){return this.dead||this.reachedEnd;}
        drawEyes(ctx,s){
            const sp=s*.35,ey=-s*.1,es=s*.18;
            if(!this.blink){
                ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-sp,ey,es*1.2,es*1.3,0,0,Math.PI*2);ctx.fill();
                ctx.beginPath();ctx.ellipse(sp,ey,es*1.2,es*1.3,0,0,Math.PI*2);ctx.fill();
                ctx.fillStyle=this.eyeColor;ctx.beginPath();ctx.arc(-sp+1,ey,es*.7,0,Math.PI*2);ctx.fill();
                ctx.beginPath();ctx.arc(sp+1,ey,es*.7,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-sp-.5,ey-es*.35,es*.3,0,Math.PI*2);ctx.fill();
                ctx.beginPath();ctx.arc(sp-.5,ey-es*.35,es*.3,0,Math.PI*2);ctx.fill();
            }else{
                ctx.strokeStyle=this.eyeColor;ctx.lineWidth=1.5;ctx.lineCap='round';
                ctx.beginPath();ctx.arc(-sp,ey,es*.6,0,Math.PI);ctx.stroke();
                ctx.beginPath();ctx.arc(sp,ey,es*.6,0,Math.PI);ctx.stroke();
            }
            ctx.strokeStyle=this.eyeColor;ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,s*.25,s*.15,0,Math.PI);ctx.stroke();
        }
        draw(ctx){
            if(this.isGone)return;ctx.save();
            const b=Math.sin(this.bounce)*2;ctx.translate(this.x,this.y+b);
            const fl=Math.max(0,this.hitFlash),fc=fl>.5?'#fff':this.color;
            ctx.fillStyle=fc;ctx.shadowColor=this.glowColor;ctx.shadowBlur=10;const s=this.size;
            if(this.shape==='blob'){
                const w1=Math.sin(this.bounce*1.3)*1.5,w2=Math.sin(this.bounce*.9+1)*1.5;
                ctx.beginPath();ctx.moveTo(0,-s);ctx.bezierCurveTo(s+w1,-s,s+w2,s*.5,s*.7,s);ctx.bezierCurveTo(s*.3,s*1.15,-s*.3,s*1.15,-s*.7,s);ctx.bezierCurveTo(-s-w2,s*.5,-s-w1,-s,0,-s);ctx.closePath();ctx.fill();
                ctx.strokeStyle=this.glowColor;ctx.lineWidth=1.5;ctx.stroke();
                ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.ellipse(-s*.25,-s*.45,s*.3,s*.2,-.3,0,Math.PI*2);ctx.fill();
                if(fl<=.5)this.drawEyes(ctx,s);
            }else if(this.shape==='ghost'){
                ctx.beginPath();ctx.moveTo(-s,s);ctx.lineTo(-s,-s*.3);ctx.bezierCurveTo(-s,-s*1.2,s,-s*1.2,s,-s*.3);ctx.lineTo(s,s);
                for(let i=0;i<4;i++){const wx=s-(2*s/4)*(i+.5),wy=s+(i%2===0?4:-1),wx2=s-(2*s/4)*(i+1);ctx.quadraticCurveTo(wx,wy,wx2,s);}
                ctx.closePath();ctx.fill();ctx.strokeStyle=this.glowColor;ctx.lineWidth=1.5;ctx.stroke();
                ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.ellipse(-s*.3,-s*.6,s*.25,s*.35,-.2,0,Math.PI*2);ctx.fill();
                if(fl<=.5)this.drawEyes(ctx,s);
            }else{
                const sq=Math.sin(this.bounce)*1;ctx.beginPath();ctx.ellipse(0,0,s+sq,s-sq*.5,0,0,Math.PI*2);ctx.fill();
                ctx.strokeStyle=this.glowColor;ctx.lineWidth=2;ctx.stroke();
                ctx.fillStyle='rgba(255,255,255,.2)';ctx.beginPath();ctx.ellipse(-s*.25,-s*.35,s*.35,s*.2,-.3,0,Math.PI*2);ctx.fill();
                if(fl<=.5)this.drawEyes(ctx,s*1.2);
            }
            ctx.shadowBlur=0;
            if(this.hp<this.maxHp){
                const bw=28,bh=5,bx=-bw/2,by=-this.size-12,r=this.hp/this.maxHp;
                ctx.fillStyle='rgba(0,0,0,.5)';ctx.beginPath();ctx.roundRect(bx-1,by-1,bw+2,bh+2,3);ctx.fill();
                ctx.fillStyle=r<.3?'#ef4444':r<.6?'#f59e0b':'#22c55e';ctx.beginPath();ctx.roundRect(bx,by,bw*r,bh,2);ctx.fill();
            }
            ctx.restore();
        }
    }

    // ==================== CLASSE PROJECTILE ====================

    class Projectile{
        constructor(x,y,target,dmg,spd,color,aoe=0){
            this.x=x;this.y=y;this.target=target;this.tx=target.x;this.ty=target.y;
            this.damage=dmg;this.speed=spd;this.color=color;this.aoeRadius=aoe;
            this.dead=false;this.size=aoe>0?6:4;this.trail=[];this.rot=0;this.isHeart=aoe>0;
        }
        update(dt){
            if(this.dead)return;this.trail.push({x:this.x,y:this.y});if(this.trail.length>8)this.trail.shift();this.rot+=dt*12;
            if(this.target&&!this.target.isGone){this.tx=this.target.x;this.ty=this.target.y;}
            const dx=this.tx-this.x,dy=this.ty-this.y,d=Math.hypot(dx,dy),m=this.speed*dt;
            if(d<=m+8){this.x=this.tx;this.y=this.ty;this.dead=true;}else{this.x+=dx/d*m;this.y+=dy/d*m;}
            if(this.x<-50||this.x>CW+50||this.y<-50||this.y>CH+50)this.dead=true;
        }
        draw(ctx){
            if(this.dead)return;ctx.save();
            for(let i=0;i<this.trail.length;i++){const a=i/this.trail.length*.35,s=this.size*i/this.trail.length*.6;ctx.globalAlpha=a;ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(this.trail[i].x,this.trail[i].y,s,0,Math.PI*2);ctx.fill();}
            ctx.globalAlpha=1;ctx.shadowColor=this.color;ctx.shadowBlur=14;ctx.fillStyle=this.color;
            ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);
            if(this.isHeart){ctx.beginPath();ctx.moveTo(0,this.size*.3);ctx.bezierCurveTo(-this.size,-this.size*.5,-this.size*.5,-this.size,0,-this.size*.4);ctx.bezierCurveTo(this.size*.5,-this.size,this.size,-this.size*.5,0,this.size*.3);ctx.fill();}
            else{ctx.beginPath();for(let i=0;i<5;i++){const a2=(Math.PI*2/5)*i-Math.PI/2;ctx.lineTo(Math.cos(a2)*this.size,Math.sin(a2)*this.size);const ia=a2+Math.PI/5;ctx.lineTo(Math.cos(ia)*this.size*.4,Math.sin(ia)*this.size*.4);}ctx.closePath();ctx.fill();}
            ctx.restore();
            ctx.fillStyle='#fff';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(this.x,this.y,this.size*.3,0,Math.PI*2);ctx.fill();
            ctx.restore();
        }
    }

    // ==================== CLASSE TOUR ====================

    class Tower{
        constructor(gx,gy,type){
            this.gridX=gx;this.gridY=gy;this.x=gx*CELL+CELL/2;this.y=gy*CELL+CELL/2;this.type=type;
            const d=TOWER_DEFS[type];Object.assign(this,{name:d.name,emoji:d.emoji,range:d.range,damage:d.damage,cooldown:d.cooldown,projSpeed:d.projSpeed||0,color:d.color,colorLight:d.colorLight,colorDark:d.colorDark,cost:d.cost,aoeRadius:d.aoeRadius||0,instant:d.instant||false,desc:d.desc});
            this.cdTimer=0;this.target=null;this.tAngle=0;this.kills=0;this.totalDmg=0;
            this.pulse=Math.random()*Math.PI*2;this.blinkT=Math.random()*3+1;this.blink=false;this.atkAnim=0;
        }
        findTarget(enemies){
            let best=null,bestP=-1;
            for(const e of enemies){if(e.isGone)continue;if(dist(this.x,this.y,e.x,e.y)<=this.range&&e.distTrav>bestP){bestP=e.distTrav;best=e;}}
            this.target=best;if(this.target)this.tAngle=Math.atan2(this.target.y-this.y,this.target.x-this.x);
        }
        update(dt,enemies,game){
            this.pulse+=dt*3;this.cdTimer-=dt;this.blinkT-=dt;
            if(this.blinkT<=0){this.blink=!this.blink;this.blinkT=this.blink?.12:2+Math.random()*4;}
            if(this.atkAnim>0)this.atkAnim-=dt*8;
            this.findTarget(enemies);
            if(this.target&&this.cdTimer<=0){this.shoot(game);this.cdTimer=this.cooldown;this.atkAnim=1;}
        }
        shoot(game){
            if(!this.target)return;
            if(this.instant){
                this.target.takeDamage(this.damage);this.totalDmg+=this.damage;if(this.target.dead)this.kills++;
                game.effects.push(new BeamEffect(this.x,this.y,this.target.x,this.target.y,this.color));
                for(let i=0;i<5;i++){const a=Math.random()*Math.PI*2,s=40+Math.random()*80;game.particles.push(new Particle(this.target.x,this.target.y,Math.cos(a)*s,Math.sin(a)*s,this.color,.4+Math.random()*.3,3+Math.random()*2,['star','sparkle'][i%2]));}
                // SFX : railgun
                sfxRailgunShoot();
            }else{
                game.projectiles.push(new Projectile(this.x,this.y,this.target,this.damage,this.projSpeed,this.color,this.aoeRadius));
                // SFX : laser ou plasma
                if(this.type==='laser') sfxLaserShoot();
                else if(this.type==='plasma') sfxPlasmaShoot();
            }
        }
        drawEyes(ctx,s){
            const sp=s*.3,ey=-s*.05,es=s*.13;let lx=0,ly=0;
            if(this.target){lx=Math.cos(this.tAngle)*es*.4;ly=Math.sin(this.tAngle)*es*.4;}
            if(!this.blink){
                ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-sp,ey,es*1.4,es*1.6,0,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.ellipse(sp,ey,es*1.4,es*1.6,0,0,Math.PI*2);ctx.fill();
                ctx.fillStyle=this.colorDark;ctx.beginPath();ctx.arc(-sp+lx,ey+ly,es*.8,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sp+lx,ey+ly,es*.8,0,Math.PI*2);ctx.fill();
                ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-sp-.5,ey-es*.4,es*.35,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(sp-.5,ey-es*.4,es*.35,0,Math.PI*2);ctx.fill();
            }else{ctx.strokeStyle=this.colorDark;ctx.lineWidth=1.5;ctx.lineCap='round';ctx.beginPath();ctx.arc(-sp,ey+1,es*.7,Math.PI,Math.PI*2);ctx.stroke();ctx.beginPath();ctx.arc(sp,ey+1,es*.7,Math.PI,Math.PI*2);ctx.stroke();}
            if(this.target){ctx.fillStyle=this.colorDark;ctx.beginPath();ctx.arc(0,s*.2,s*.08,0,Math.PI*2);ctx.fill();}
            else{ctx.strokeStyle=this.colorDark;ctx.lineWidth=1;ctx.beginPath();ctx.arc(0,s*.15,s*.1,.1,Math.PI-.1);ctx.stroke();}
        }
        draw(ctx,time){
            ctx.save();const ab=this.atkAnim>0?Math.sin(this.atkAnim*Math.PI)*3:0;
            ctx.translate(this.x,this.y-ab);
            ctx.fillStyle='rgba(0,0,0,.2)';ctx.beginPath();ctx.ellipse(0,16+ab,14,5,0,0,Math.PI*2);ctx.fill();
            const s=16;ctx.shadowColor=this.color;ctx.shadowBlur=12;
            if(this.type==='laser'){
                ctx.fillStyle=this.color;
                ctx.beginPath();ctx.moveTo(-s*.7,-s*.3);ctx.lineTo(-s*.45,-s);ctx.lineTo(-s*.1,-s*.4);ctx.closePath();ctx.fill();
                ctx.beginPath();ctx.moveTo(s*.7,-s*.3);ctx.lineTo(s*.45,-s);ctx.lineTo(s*.1,-s*.4);ctx.closePath();ctx.fill();
                ctx.fillStyle=this.colorLight+'60';
                ctx.beginPath();ctx.moveTo(-s*.6,-s*.35);ctx.lineTo(-s*.45,-s*.8);ctx.lineTo(-s*.2,-s*.42);ctx.closePath();ctx.fill();
                ctx.beginPath();ctx.moveTo(s*.6,-s*.35);ctx.lineTo(s*.45,-s*.8);ctx.lineTo(s*.2,-s*.42);ctx.closePath();ctx.fill();
                ctx.fillStyle=this.colorLight;ctx.strokeStyle=this.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,s*.75,0,Math.PI*2);ctx.fill();ctx.stroke();
                const ta=this.tAngle+Math.PI+Math.sin(time*5)*.3;ctx.strokeStyle=this.color;ctx.lineWidth=2.5;ctx.lineCap='round';ctx.beginPath();ctx.moveTo(Math.cos(ta)*s*.6,Math.sin(ta)*s*.6);const tx1=Math.cos(ta)*s*1.1,ty1=Math.sin(ta)*s*1.1;ctx.quadraticCurveTo(tx1,ty1,tx1+Math.cos(ta+.8)*s*.5,ty1+Math.sin(ta+.8)*s*.5);ctx.stroke();
                this.drawEyes(ctx,s);
                ctx.strokeStyle=this.color;ctx.lineWidth=.8;for(let sd=-1;sd<=1;sd+=2)for(let w=-1;w<=1;w++){ctx.beginPath();ctx.moveTo(sd*s*.35,s*.1+w*3);ctx.lineTo(sd*s*.95,s*.05+w*5);ctx.stroke();}
            }else if(this.type==='plasma'){
                ctx.fillStyle=this.color;ctx.beginPath();ctx.arc(-s*.55,-s*.65,s*.35,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.55,-s*.65,s*.35,0,Math.PI*2);ctx.fill();
                ctx.fillStyle=this.colorLight+'80';ctx.beginPath();ctx.arc(-s*.55,-s*.65,s*.2,0,Math.PI*2);ctx.fill();ctx.beginPath();ctx.arc(s*.55,-s*.65,s*.2,0,Math.PI*2);ctx.fill();
                ctx.fillStyle=this.colorLight;ctx.strokeStyle=this.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,s*.8,0,Math.PI*2);ctx.fill();ctx.stroke();
                ctx.fillStyle=this.colorDark;ctx.beginPath();ctx.ellipse(0,s*.08,s*.08,s*.06,0,0,Math.PI*2);ctx.fill();
                this.drawEyes(ctx,s);
            }else{
                const ew=Math.sin(time*3)*.1;
                ctx.fillStyle=this.colorLight;ctx.strokeStyle=this.color;ctx.lineWidth=1.5;
                ctx.save();ctx.translate(-s*.3,-s*.5);ctx.rotate(-.2+ew);ctx.beginPath();ctx.ellipse(0,-s*.6,s*.18,s*.55,0,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.fillStyle='#fca5a5';ctx.beginPath();ctx.ellipse(0,-s*.6,s*.1,s*.4,0,0,Math.PI*2);ctx.fill();ctx.restore();
                ctx.save();ctx.translate(s*.3,-s*.5);ctx.rotate(.2-ew);ctx.fillStyle=this.colorLight;ctx.beginPath();ctx.ellipse(0,-s*.6,s*.18,s*.55,0,0,Math.PI*2);ctx.fill();ctx.strokeStyle=this.color;ctx.stroke();ctx.fillStyle='#fca5a5';ctx.beginPath();ctx.ellipse(0,-s*.6,s*.1,s*.4,0,0,Math.PI*2);ctx.fill();ctx.restore();
                ctx.fillStyle=this.colorLight;ctx.strokeStyle=this.color;ctx.lineWidth=2;ctx.beginPath();ctx.arc(0,0,s*.75,0,Math.PI*2);ctx.fill();ctx.stroke();
                const pa=this.tAngle+Math.PI;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(Math.cos(pa)*s*.7,Math.sin(pa)*s*.7,s*.2,0,Math.PI*2);ctx.fill();ctx.strokeStyle=this.color;ctx.lineWidth=1;ctx.stroke();
                this.drawEyes(ctx,s);
            }
            ctx.restore();
        }
    }

    // ==================== DÉCORS ANIMÉS PAR MONDE ====================

    class Firefly{
        constructor(){this.x=Math.random()*CW;this.y=Math.random()*CH;this.phase=Math.random()*Math.PI*2;this.speed=10+Math.random()*20;this.angle=Math.random()*Math.PI*2;this.turnRate=.5+Math.random()*2;this.size=1.5+Math.random()*2;this.color=['#34d399','#fbbf24','#a3e635','#6ee7b7'][0|Math.random()*4];}
        update(dt,t){this.angle+=Math.sin(t*this.turnRate+this.phase)*dt*2;this.x+=Math.cos(this.angle)*this.speed*dt;this.y+=Math.sin(this.angle)*this.speed*dt;if(this.x<-20)this.x=CW+20;if(this.x>CW+20)this.x=-20;if(this.y<-20)this.y=CH+20;if(this.y>CH+20)this.y=-20;}
        draw(ctx,t){const a=.3+Math.sin(t*3+this.phase)*.4;ctx.save();ctx.globalAlpha=a;ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=this.size*6;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.fill();ctx.restore();}
    }

    class FallingCandy{
        constructor(){this.reset();}
        reset(){this.x=Math.random()*CW;this.y=-20-Math.random()*200;this.vy=12+Math.random()*25;this.vx=-3+Math.random()*6;this.rot=Math.random()*Math.PI*2;this.rs=1+Math.random()*3;this.size=4+Math.random()*6;this.shape=0|Math.random()*3;this.color=['#e879f9','#fb923c','#fbbf24','#67e8f9','#a78bfa'][0|Math.random()*5];this.alpha=.15+Math.random()*.2;}
        update(dt){this.y+=this.vy*dt;this.x+=this.vx*dt;this.rot+=this.rs*dt;if(this.y>CH+30)this.reset();}
        draw(ctx){ctx.save();ctx.translate(this.x,this.y);ctx.rotate(this.rot);ctx.globalAlpha=this.alpha;ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=4;
        if(this.shape===0){ctx.beginPath();ctx.arc(0,0,this.size,0,Math.PI*2);ctx.fill();ctx.fillStyle='rgba(255,255,255,.3)';ctx.beginPath();ctx.arc(-this.size*.25,-this.size*.25,this.size*.35,0,Math.PI*2);ctx.fill();}
        else if(this.shape===1){ctx.beginPath();for(let i=0;i<5;i++){const a=(Math.PI*2/5)*i-Math.PI/2;ctx.lineTo(Math.cos(a)*this.size,Math.sin(a)*this.size);const ia=a+Math.PI/5;ctx.lineTo(Math.cos(ia)*this.size*.4,Math.sin(ia)*this.size*.4);}ctx.closePath();ctx.fill();}
        else{ctx.beginPath();ctx.moveTo(0,this.size*.3);ctx.bezierCurveTo(-this.size,-this.size*.5,-this.size*.5,-this.size,0,-this.size*.4);ctx.bezierCurveTo(this.size*.5,-this.size,this.size,-this.size*.5,0,this.size*.3);ctx.fill();}
        ctx.restore();}
    }

    class Bubble{
        constructor(){this.reset();}
        reset(){this.x=Math.random()*CW;this.y=CH+10+Math.random()*100;this.vy=-(10+Math.random()*25);this.vx=Math.sin(Math.random()*Math.PI*2)*5;this.size=3+Math.random()*8;this.phase=Math.random()*Math.PI*2;this.alpha=.08+Math.random()*.15;this.color=['#38bdf8','#7dd3fc','#2dd4bf','#67e8f9'][0|Math.random()*4];}
        update(dt,t){this.y+=this.vy*dt;this.x+=Math.sin(t+this.phase)*8*dt+this.vx*dt;this.vx*=.99;if(this.y<-20)this.reset();}
        draw(ctx){ctx.save();ctx.globalAlpha=this.alpha;ctx.strokeStyle=this.color;ctx.lineWidth=1;ctx.shadowColor=this.color;ctx.shadowBlur=6;ctx.beginPath();ctx.arc(this.x,this.y,this.size,0,Math.PI*2);ctx.stroke();ctx.fillStyle='rgba(255,255,255,.15)';ctx.beginPath();ctx.arc(this.x-this.size*.3,this.y-this.size*.3,this.size*.25,0,Math.PI*2);ctx.fill();ctx.restore();}
    }

    class ShootingStar{
        constructor(){this.reset();this.timer=Math.random()*5;}
        reset(){this.x=-50;this.y=Math.random()*CH*.6;this.active=false;this.timer=2+Math.random()*6;this.len=60+Math.random()*120;this.speed=300+Math.random()*400;this.angle=.2+Math.random()*.5;this.alpha=0;this.color=['#a78bfa','#f472b6','#818cf8','#fbbf24'][0|Math.random()*4];}
        update(dt){this.timer-=dt;if(!this.active&&this.timer<=0){this.active=true;this.x=-50;this.y=Math.random()*CH*.5;this.alpha=.7;}if(this.active){this.x+=Math.cos(this.angle)*this.speed*dt;this.y+=Math.sin(this.angle)*this.speed*dt;if(this.x>CW+100)this.reset();}}
        draw(ctx){if(!this.active)return;ctx.save();ctx.globalAlpha=this.alpha;const ex=this.x-Math.cos(this.angle)*this.len,ey=this.y-Math.sin(this.angle)*this.len;const g=ctx.createLinearGradient(this.x,this.y,ex,ey);g.addColorStop(0,'#fff');g.addColorStop(.3,this.color);g.addColorStop(1,'transparent');ctx.strokeStyle=g;ctx.lineWidth=2;ctx.lineCap='round';ctx.shadowColor='#fff';ctx.shadowBlur=8;ctx.beginPath();ctx.moveTo(this.x,this.y);ctx.lineTo(ex,ey);ctx.stroke();ctx.restore();}
    }

    class LavaParticle{
        constructor(){this.reset();}
        reset(){this.x=Math.random()*CW;this.y=CH+10+Math.random()*50;this.vy=-(15+Math.random()*35);this.vx=-8+Math.random()*16;this.size=2+Math.random()*5;this.life=2+Math.random()*3;this.maxLife=this.life;this.color=['#f87171','#fb923c','#fbbf24','#fde047'][0|Math.random()*4];this.glow=8+Math.random()*12;}
        update(dt){this.y+=this.vy*dt;this.x+=this.vx*dt;this.vy+=15*dt;this.life-=dt;if(this.life<=0)this.reset();}
        draw(ctx){const a=Math.max(0,this.life/this.maxLife);ctx.save();ctx.globalAlpha=a*.4;ctx.fillStyle=this.color;ctx.shadowColor=this.color;ctx.shadowBlur=this.glow*a;ctx.beginPath();ctx.arc(this.x,this.y,this.size*a,0,Math.PI*2);ctx.fill();ctx.restore();}
    }

    // ==================== CLASSE JEU ====================

    class Game{
        constructor(canvas,worldIdx){
            this.canvas=canvas;this.ctx=canvas.getContext('2d');
            canvas.width=CW;canvas.height=CH;
            this.worldIdx=worldIdx;this.world=WORLDS[worldIdx];
            this.credits=200;this.lives=20;this.score=0;
            this.wave=0;this.waveActive=false;this.gameOver=false;this.paused=false;this.speed=1;
            this.worldComplete=false;
            this.towers=[];this.enemies=[];this.projectiles=[];this.particles=[];this.effects=[];this.floatingTexts=[];
            this.waveEnemies=[];this.enemiesSpawned=0;this.spawnTimer=0;this.spawnInterval=.8;this.totalWaveEnemies=0;
            this.placingTower=null;this.selectedTower=null;this.mouseX=-1;this.mouseY=-1;
            this.time=0;

            this.bgStars=Array.from({length:120},()=>({
                x:Math.random()*CW,y:Math.random()*CH,
                s:.3+Math.random()*1.8,b:Math.random()*Math.PI*2,bs:.5+Math.random()*2,
                c:this.world.particleColors[0|Math.random()*this.world.particleColors.length]
            }));

            this.nebulas=Array.from({length:3},()=>({
                x:Math.random()*CW,y:Math.random()*CH,
                r:80+Math.random()*180,phase:Math.random()*Math.PI*2,
                speed:.15+Math.random()*.4,
                c1:this.world.accentColor,c2:this.world.secondAccent
            }));

            this.worldDecors=[];
            const dt=this.world.decorType;
            if(dt==='fireflies')for(let i=0;i<40;i++)this.worldDecors.push(new Firefly());
            else if(dt==='candyRain')for(let i=0;i<25;i++)this.worldDecors.push(new FallingCandy());
            else if(dt==='underwater')for(let i=0;i<30;i++)this.worldDecors.push(new Bubble());
            else if(dt==='nebula'){for(let i=0;i<5;i++)this.worldDecors.push(new ShootingStar());}
            else if(dt==='lava')for(let i=0;i<35;i++)this.worldDecors.push(new LavaParticle());

            this.grassBlades=[];
            for(const k of pathCells){
                const[cx,cy]=k.split(',').map(Number);
                for(let d=0;d<4;d++){
                    const nx=cx+[0,0,-1,1][d],ny=cy+[-1,1,0,0][d];
                    if(nx>=0&&nx<COLS&&ny>=0&&ny<ROWS&&!pathCells.has(`${nx},${ny}`)){
                        if(Math.random()<.4){
                            this.grassBlades.push({
                                x:nx*CELL+Math.random()*CELL,y:ny*CELL+Math.random()*CELL,
                                h:6+Math.random()*10,w:1+Math.random()*2,
                                phase:Math.random()*Math.PI*2,speed:2+Math.random()*3,
                                color:this.world.particleColors[0|Math.random()*this.world.particleColors.length]
                            });
                        }
                    }
                }
            }
        }

        generateWave(n){
            const enemies=[],w=this.world;
            const hpM=w.hpMult*(1+(n-1)*.22),spM=w.speedMult*(1+(n-1)*.04);
            const nS=Math.floor(n*1.5)+1,nSo=n+2,nT=Math.max(0,Math.floor((n-2)*.8));
            for(let i=0;i<nS;i++)enemies.push({type:'scout',hpM,spM});
            for(let i=0;i<nSo;i++)enemies.push({type:'soldier',hpM,spM});
            for(let i=0;i<nT;i++)enemies.push({type:'tank',hpM,spM});
            return shuffle(enemies);
        }
        startWave(){
            if(this.waveActive||this.gameOver||this.worldComplete)return;
            this.wave++;this.waveActive=true;
            const wd=this.generateWave(this.wave);
            this.waveEnemies=wd;this.totalWaveEnemies=wd.length;
            this.enemiesSpawned=0;this.spawnTimer=0;
            this.spawnInterval=Math.max(.3,.8-this.wave*.025);
            // SFX : début de vague
            sfxWaveStart();
            updateUI();
        }
        updateSpawn(dt){
            if(!this.waveActive)return;
            this.spawnTimer+=dt;
            if(this.spawnTimer>=this.spawnInterval&&this.enemiesSpawned<this.waveEnemies.length){
                const d=this.waveEnemies[this.enemiesSpawned];
                const w={...this.world,hpMult:d.hpM,speedMult:d.spM};
                this.enemies.push(new Enemy(d.type,w));
                this.enemiesSpawned++;this.spawnTimer=0;
            }
        }
        checkWaveComplete(){
            if(!this.waveActive)return;
            if(this.enemiesSpawned>=this.waveEnemies.length&&this.enemies.length===0){
                this.waveActive=false;
                const bonus=30+this.wave*10;this.credits+=bonus;this.score+=this.wave*50;
                this.floatingTexts.push(new FloatingText(CW/2,CH/2,`✿ Vague ${this.wave} terminée ! +${bonus} 🍬`,this.world.accentColor,18));
                // SFX : vague terminée
                sfxWaveComplete();
                if(this.wave>=this.world.waves){
                    this.worldComplete=true;
                    unlockNextWorld(this.worldIdx);
                    // SFX : monde terminé
                    setTimeout(()=>{sfxWorldComplete();showWorldComplete(this);},800);
                }
                updateUI();
            }
        }
        canPlace(gx,gy){return gx>=0&&gx<COLS&&gy>=0&&gy<ROWS&&!pathCells.has(`${gx},${gy}`)&&!this.towers.find(t=>t.gridX===gx&&t.gridY===gy);}
        placeTower(gx,gy,type){
            const d=TOWER_DEFS[type];if(this.credits<d.cost||!this.canPlace(gx,gy))return false;
            this.credits-=d.cost;const t=new Tower(gx,gy,type);this.towers.push(t);this.placingTower=null;
            for(let i=0;i<8;i++){const a=Math.PI*2/8*i,s=40+Math.random()*60;this.particles.push(new Particle(t.x,t.y,Math.cos(a)*s,Math.sin(a)*s-30,d.color,.5+Math.random()*.3,3+Math.random()*3,['star','heart','sparkle'][i%3]));}
            // SFX : placement de tour
            sfxPlaceTower();
            updateUI();return true;
        }
        sellTower(t){
            const r=Math.floor(t.cost*.6);this.credits+=r;
            for(let i=0;i<6;i++){const a=Math.PI*2/6*i,s=30+Math.random()*50;this.particles.push(new Particle(t.x,t.y,Math.cos(a)*s,Math.sin(a)*s-20,this.world.accentColor,.5,4,'heart'));}
            this.floatingTexts.push(new FloatingText(t.x,t.y-20,`+${r} 🍬`,'#fbbf24',12));
            this.towers=this.towers.filter(x=>x!==t);this.selectedTower=null;
            // SFX : vente de tour
            sfxSellTower();
            updateUI();
        }
        update(dt){
            if(this.gameOver||this.paused||this.worldComplete)return;
            const adt=dt*this.speed;this.time+=adt;
            for(const d of this.worldDecors){if(d.update.length>1)d.update(adt,this.time);else d.update(adt);}
            this.updateSpawn(adt);
            for(const e of this.enemies)e.update(adt);
            for(const t of this.towers)t.update(adt,this.enemies,this);
            for(const p of this.projectiles)p.update(adt);
            // Collisions projectiles
            for(const p of this.projectiles){
                if(p.dead){
                    if(p.aoeRadius>0){
                        this.applyAOE(p.x,p.y,p.aoeRadius,p.damage,p.color);
                        sfxPlasmaExplode();
                    }else if(p.target&&!p.target.dead){
                        p.target.takeDamage(p.damage);
                    }
                }
            }
            // Morts / arrivés
            for(const e of this.enemies){
                if(e.dead){
                    this.credits+=e.reward;this.score+=e.scoreValue;
                    this.spawnDeath(e);
                    this.floatingTexts.push(new FloatingText(e.x,e.y-15,`+${e.reward}🍬`,'#fbbf24',11));
                    // SFX : mort ennemi
                    sfxEnemyDeath();
                }else if(e.reachedEnd){
                    this.lives--;
                    this.floatingTexts.push(new FloatingText(e.x,e.y-15,'-1💖','#f87171',13));
                    // SFX : vie perdue
                    sfxLifeLost();
                }
            }
            for(const p of this.particles)p.update(adt);for(const e of this.effects)e.update(adt);for(const f of this.floatingTexts)f.update(adt);
            this.enemies=this.enemies.filter(e=>!e.isGone);this.projectiles=this.projectiles.filter(p=>!p.dead);this.particles=this.particles.filter(p=>!p.isDead);this.effects=this.effects.filter(e=>!e.isDead);this.floatingTexts=this.floatingTexts.filter(f=>!f.isDead);
            this.checkWaveComplete();
            if(this.lives<=0){
                this.lives=0;this.gameOver=true;updateUI();
                // SFX : game over
                setTimeout(()=>{sfxGameOver();showGameOver();},600);
            }
        }
        applyAOE(x,y,r,dmg,c){
            this.effects.push(new AOEEffect(x,y,r,c));
            for(let i=0;i<10;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*100;this.particles.push(new Particle(x,y,Math.cos(a)*s,Math.sin(a)*s-20,c,.4+Math.random()*.4,3+Math.random()*4,['heart','star','sparkle'][i%3]));}
            for(const e of this.enemies){if(e.isGone)continue;const d=dist(x,y,e.x,e.y);if(d<=r){e.takeDamage(Math.round(dmg*(1-d/r*.5)));}}
        }
        spawnDeath(e){
            const cols=[e.color,...this.world.particleColors.slice(0,3),'#fff'];
            for(let i=0;i<12;i++){const a=Math.PI*2/12*i+Math.random()*.3,s=40+Math.random()*100;this.particles.push(new Particle(e.x,e.y,Math.cos(a)*s,Math.sin(a)*s-30,cols[i%cols.length],.5+Math.random()*.6,2+Math.random()*4,['star','heart','sparkle','circle'][i%4]));}
        }
        render(){
            const ctx=this.ctx,w=this.world;ctx.clearRect(0,0,CW,CH);

            const bg=ctx.createRadialGradient(CW/2,CH/2,0,CW/2,CH/2,CW*.7);
            bg.addColorStop(0,w.bgGrad1);bg.addColorStop(.5,w.bgGrad2);bg.addColorStop(1,w.bgBase);
            ctx.fillStyle=bg;ctx.fillRect(0,0,CW,CH);

            for(const n of this.nebulas){
                const nx=n.x+Math.sin(this.time*n.speed+n.phase)*50;
                const ny=n.y+Math.cos(this.time*n.speed*.6+n.phase)*35;
                const g=ctx.createRadialGradient(nx,ny,0,nx,ny,n.r);
                g.addColorStop(0,n.c1+'12');g.addColorStop(.5,n.c2+'06');g.addColorStop(1,'transparent');
                ctx.fillStyle=g;ctx.fillRect(0,0,CW,CH);
            }

            for(const s of this.bgStars){
                s.b+=.016*s.bs;
                const a=.15+Math.sin(s.b)*.35;
                ctx.save();ctx.globalAlpha=a;ctx.fillStyle=s.c;ctx.shadowColor=s.c;ctx.shadowBlur=s.s*3;
                ctx.beginPath();ctx.arc(s.x,s.y,s.s,0,Math.PI*2);ctx.fill();ctx.restore();
            }

            for(const d of this.worldDecors){if(d.draw.length>1)d.draw(ctx,this.time);else d.draw(ctx);}

            for(const g of this.grassBlades){
                const sway=Math.sin(this.time*g.speed+g.phase)*4;
                ctx.save();ctx.globalAlpha=.35;ctx.strokeStyle=g.color;ctx.lineWidth=g.w;ctx.lineCap='round';ctx.shadowColor=g.color;ctx.shadowBlur=4;
                ctx.beginPath();ctx.moveTo(g.x,g.y);ctx.quadraticCurveTo(g.x+sway,g.y-g.h*.6,g.x+sway*1.5,g.y-g.h);ctx.stroke();ctx.restore();
            }

            for(const k of pathCells){
                const[cx,cy]=k.split(',').map(Number);
                ctx.fillStyle=(cx+cy)%2===0?w.pathColor1:w.pathColor2;
                ctx.fillRect(cx*CELL,cy*CELL,CELL,CELL);
            }
            ctx.save();
            ctx.strokeStyle=w.pathGlow+'25';ctx.lineWidth=20;ctx.lineCap='round';ctx.lineJoin='round';
            ctx.beginPath();ctx.moveTo(WAYPOINTS[1].x,WAYPOINTS[1].y);for(let i=2;i<WAYPOINTS.length-1;i++)ctx.lineTo(WAYPOINTS[i].x,WAYPOINTS[i].y);ctx.stroke();
            ctx.strokeStyle=w.pathGlow+'18';ctx.lineWidth=1.5;ctx.setLineDash([4,8]);
            ctx.beginPath();ctx.moveTo(WAYPOINTS[1].x,WAYPOINTS[1].y);for(let i=2;i<WAYPOINTS.length-1;i++)ctx.lineTo(WAYPOINTS[i].x,WAYPOINTS[i].y);ctx.stroke();ctx.setLineDash([]);
            ctx.restore();

            for(const k of pathCells){const[cx,cy]=k.split(',').map(Number);const x=cx*CELL,y=cy*CELL;ctx.strokeStyle=w.pathBorder;ctx.lineWidth=1;
            if(!pathCells.has(`${cx},${cy-1}`)){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+CELL,y);ctx.stroke();}
            if(!pathCells.has(`${cx},${cy+1}`)){ctx.beginPath();ctx.moveTo(x,y+CELL);ctx.lineTo(x+CELL,y+CELL);ctx.stroke();}
            if(!pathCells.has(`${cx-1},${cy}`)){ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x,y+CELL);ctx.stroke();}
            if(!pathCells.has(`${cx+1},${cy}`)){ctx.beginPath();ctx.moveTo(x+CELL,y);ctx.lineTo(x+CELL,y+CELL);ctx.stroke();}}

            if(this.placingTower){ctx.strokeStyle=w.accentColor+'0a';ctx.lineWidth=.5;for(let x=0;x<=COLS;x++){ctx.beginPath();ctx.moveTo(x*CELL,0);ctx.lineTo(x*CELL,CH);ctx.stroke();}for(let y=0;y<=ROWS;y++){ctx.beginPath();ctx.moveTo(0,y*CELL);ctx.lineTo(CW,y*CELL);ctx.stroke();}}

            const ey=2*CELL+CELL/2;ctx.save();
            for(let i=0;i<6;i++){
                const pc=w.particleColors[i%w.particleColors.length];
                ctx.strokeStyle=pc;ctx.globalAlpha=.4+Math.sin(this.time*2+i)*.2;ctx.lineWidth=2;ctx.shadowColor=pc;ctx.shadowBlur=8;
                ctx.beginPath();ctx.arc(8,ey,12+i*2.5,-Math.PI*.6,Math.PI*.6);ctx.stroke();
            }
            ctx.globalAlpha=1;ctx.shadowBlur=0;ctx.fillStyle=w.accentColor;ctx.font='16px Nunito';ctx.fillText('→',22,ey+5);ctx.restore();

            const bx=CW-12,by=10*CELL+CELL/2;ctx.save();
            const hp2=Math.sin(this.time*2)*.2+.8;
            ctx.shadowColor=w.accentColor;ctx.shadowBlur=18*hp2;ctx.fillStyle=w.accentColor;ctx.globalAlpha=hp2;
            ctx.save();ctx.translate(bx,by);const hs=.8+Math.sin(this.time*3)*.1;ctx.scale(hs,hs);
            ctx.beginPath();ctx.moveTo(0,6);ctx.bezierCurveTo(-16,-8,-12,-20,0,-10);ctx.bezierCurveTo(12,-20,16,-8,0,6);ctx.fill();ctx.restore();ctx.restore();

            for(const t of this.towers)t.draw(ctx,this.time);
            for(const e of this.enemies)e.draw(ctx);
            for(const p of this.projectiles)p.draw(ctx);
            for(const e of this.effects)e.draw(ctx);
            for(const p of this.particles)p.draw(ctx);
            for(const f of this.floatingTexts)f.draw(ctx);

            if(this.selectedTower){const t=this.selectedTower;ctx.save();const ra=.1+Math.sin(this.time*3)*.05;ctx.fillStyle=t.color+'08';ctx.strokeStyle=t.color;ctx.globalAlpha=ra+.15;ctx.lineWidth=1.5;ctx.setLineDash([6,4]);ctx.beginPath();ctx.arc(t.x,t.y,t.range,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=.4;ctx.strokeStyle=t.color;ctx.lineWidth=2;ctx.beginPath();ctx.roundRect(t.gridX*CELL+2,t.gridY*CELL+2,CELL-4,CELL-4,6);ctx.stroke();ctx.restore();}

            if(this.placingTower&&this.mouseX>=0){const gx=Math.floor(this.mouseX/CELL),gy=Math.floor(this.mouseY/CELL);if(gx>=0&&gx<COLS&&gy>=0&&gy<ROWS){const v=this.canPlace(gx,gy),d=TOWER_DEFS[this.placingTower];ctx.save();if(v){ctx.fillStyle='rgba(52,211,153,.1)';ctx.beginPath();ctx.roundRect(gx*CELL+2,gy*CELL+2,CELL-4,CELL-4,6);ctx.fill();ctx.strokeStyle='rgba(52,211,153,.4)';ctx.lineWidth=1.5;ctx.stroke();const cx=gx*CELL+CELL/2,cy=gy*CELL+CELL/2;ctx.strokeStyle=d.color+'30';ctx.fillStyle=d.color+'06';ctx.lineWidth=1;ctx.setLineDash([4,4]);ctx.beginPath();ctx.arc(cx,cy,d.range,0,Math.PI*2);ctx.fill();ctx.stroke();ctx.setLineDash([]);ctx.globalAlpha=.5;ctx.font='20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(d.emoji,cx,cy);}else{ctx.fillStyle='rgba(248,113,113,.1)';ctx.beginPath();ctx.roundRect(gx*CELL+2,gy*CELL+2,CELL-4,CELL-4,6);ctx.fill();ctx.strokeStyle='rgba(248,113,113,.3)';ctx.lineWidth=1.5;ctx.stroke();}ctx.restore();}}

            if(this.paused&&!this.gameOver){ctx.save();ctx.fillStyle='rgba(13,17,23,.75)';ctx.fillRect(0,0,CW,CH);ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowColor=w.accentColor;ctx.shadowBlur=20;ctx.fillStyle=w.accentColor;ctx.font='bold 48px Nunito,sans-serif';ctx.fillText('⏸ Pause ✿',CW/2,CH/2-20);ctx.shadowBlur=0;ctx.fillStyle='#8b9dc3';ctx.font='18px Nunito';ctx.fillText('Espace pour reprendre 🌸',CW/2,CH/2+25);ctx.restore();}
            updateUI();
        }
        handleClick(mx,my){
            if(this.gameOver||this.worldComplete)return;
            const gx=Math.floor(mx/CELL),gy=Math.floor(my/CELL);
            if(this.placingTower){
                if(this.canPlace(gx,gy)&&this.credits>=TOWER_DEFS[this.placingTower].cost){
                    this.placeTower(gx,gy,this.placingTower);
                }else{
                    sfxError();
                }
            }
            else{const t=this.towers.find(t=>t.gridX===gx&&t.gridY===gy);this.selectedTower=t||null;if(t)sfxClick();updateUI();}
        }
        handleMouseMove(mx,my){this.mouseX=mx;this.mouseY=my;}
    }

    // ==================== GESTION ÉCRANS ====================

    let game=null,currentWorldIdx=0;
    const canvas=document.getElementById('gameCanvas');

    function getUnlocked(){try{return JSON.parse(localStorage.getItem('kd_unlocked'))||[0];}catch(e){return[0];}}
    function saveUnlocked(arr){localStorage.setItem('kd_unlocked',JSON.stringify(arr));}
    function unlockNextWorld(idx){const u=getUnlocked();if(idx+1<WORLDS.length&&!u.includes(idx+1)){u.push(idx+1);saveUnlocked(u);}}
    function getScores(){try{return JSON.parse(localStorage.getItem('kd_scores'))||[];}catch(e){return[];}}
    function saveScoreEntry(name,score,wave,world){const s=getScores();s.push({name,score,wave,world,date:Date.now()});s.sort((a,b)=>b.score-a.score);if(s.length>20)s.length=20;localStorage.setItem('kd_scores',JSON.stringify(s));}

    function buildWorldsMenu(){
        const grid=document.getElementById('worlds-grid'),unlocked=getUnlocked();grid.innerHTML='';
        WORLDS.forEach((w,i)=>{
            const card=document.createElement('div');card.className='world-card'+(unlocked.includes(i)?'':' locked');
            card.style.borderColor=unlocked.includes(i)?w.accentColor+'40':'rgba(99,110,140,.2)';
            card.innerHTML=`<span class="wemoji">${w.emoji}</span><div class="wname">${w.name}</div><div class="wdesc">${w.desc}</div><div class="wdiff" style="background:${w.diffColor}18;color:${w.diffColor}">${w.difficulty}</div>${!unlocked.includes(i)?'<div class="lock-overlay">🔒</div>':''}`;
            if(unlocked.includes(i)){card.onclick=()=>{initAudio();resumeAudio();sfxClick();startGame(i);};card.onmouseenter=()=>{card.style.borderColor=w.accentColor+'80';card.style.boxShadow=`0 8px 25px ${w.accentColor}20`;};card.onmouseleave=()=>{card.style.borderColor=w.accentColor+'40';card.style.boxShadow='none';};}
            grid.appendChild(card);
        });
    }

    function startGame(worldIdx){
        currentWorldIdx=worldIdx;
        document.getElementById('menu-screen').classList.add('hidden');
        document.getElementById('game-screen').style.display='block';
        game=new Game(canvas,worldIdx);
        resizeCanvas();setupGameEvents();updateUI();updateAudioBtns();
        // Démarrer la musique du monde
        if(!musicMuted){
            stopMusic();
            startMusic(game.world.id);
        }
        if(!gameLoopRunning)startGameLoop();
    }
    function backToMenu(){
        document.getElementById('game-screen').style.display='none';
        document.getElementById('menu-screen').classList.remove('hidden');
        document.getElementById('gameover-modal').classList.remove('show');
        document.getElementById('world-complete-modal').classList.remove('show');
        game=null;buildWorldsMenu();
        // Arrêter la musique de jeu
        stopMusic();
        updateMenuMusicBtn();
    }
    function showGameOver(){
        const m=document.getElementById('gameover-modal');
        document.getElementById('modal-title').textContent='💔 Oh non !';
        document.getElementById('modal-stats').innerHTML=`<div style="font-size:18px;color:#c9d1d9;margin:8px 0;">Score : <b style="color:#34d399">${game.score}</b> ⭐</div><div style="color:#8b9dc3;">Monde : ${game.world.emoji} ${game.world.name} — Vague ${game.wave}/${game.world.waves}</div>`;
        renderScoreTable('modal-scores');m.classList.add('show');
    }
    function showWorldComplete(g){
        const m=document.getElementById('world-complete-modal');
        const stars=g.lives>=15?'⭐⭐⭐':g.lives>=10?'⭐⭐':'⭐';
        document.getElementById('wc-title').textContent=`🎉 ${g.world.name} Terminé !`;
        document.getElementById('wc-stars').textContent=stars;
        document.getElementById('wc-info').innerHTML=`Score : <b>${g.score}</b> · Vies restantes : <b>${g.lives}</b>`;
        const nextBtn=document.getElementById('wc-next-btn');
        if(currentWorldIdx+1<WORLDS.length){nextBtn.style.display='';nextBtn.textContent=`➡ ${WORLDS[currentWorldIdx+1].emoji} ${WORLDS[currentWorldIdx+1].name}`;}
        else nextBtn.style.display='none';
        m.classList.add('show');
    }
    function goNextWorld(){
        document.getElementById('world-complete-modal').classList.remove('show');
        sfxClick();
        if(currentWorldIdx+1<WORLDS.length){
            const ps=game?game.score:0,pc=game?game.credits:200,pl=game?game.lives:20;
            startGame(currentWorldIdx+1);game.score=ps;game.credits=pc;game.lives=pl;updateUI();
        }
    }
    function saveScore(){
        const name=document.getElementById('player-name').value.trim()||'Anonyme';
        if(game)saveScoreEntry(name,game.score,game.wave,game.world.name);
        sfxClick();
        renderScoreTable('modal-scores');document.getElementById('player-name').value='';
    }
    function showLeaderboard(){initAudio();resumeAudio();sfxClick();renderScoreTable('leaderboard-table');document.getElementById('leaderboard-modal').classList.add('show');}
    function hideLeaderboard(){sfxClick();document.getElementById('leaderboard-modal').classList.remove('show');}
    function renderScoreTable(id){
        const scores=getScores(),t=document.getElementById(id);
        if(!scores.length){t.innerHTML='<tr><td style="padding:20px;color:#6b7a99;">Aucun score encore ! 🌸</td></tr>';return;}
        let h='<tr><th>#</th><th>Nom</th><th>Score</th><th>Monde</th><th>Vague</th></tr>';
        scores.slice(0,10).forEach((s,i)=>{const rc=i===0?'rank-1':i===1?'rank-2':i===2?'rank-3':'';h+=`<tr><td class="${rc}">${i+1}</td><td>${s.name}</td><td><b>${s.score}</b></td><td>${s.world||'?'}</td><td>${s.wave}</td></tr>`;});
        t.innerHTML=h;
    }

    // ==================== RESPONSIVE ====================
    function resizeCanvas(){
        if(!game)return;
        const isMobile=window.innerWidth<=900;
        const maxW=isMobile?window.innerWidth:window.innerWidth-240;
        const maxH=isMobile?window.innerHeight*.58:window.innerHeight;
        const ratio=CW/CH;let w=maxW,h=maxW/ratio;
        if(h>maxH){h=maxH;w=maxH*ratio;}
        canvas.style.width=Math.floor(w)+'px';canvas.style.height=Math.floor(h)+'px';
    }
    window.addEventListener('resize',resizeCanvas);

    // ==================== UI ====================
    const uiWave=document.getElementById('ui-wave'),uiScore=document.getElementById('ui-score'),uiCredits=document.getElementById('ui-credits'),uiLives=document.getElementById('ui-lives');
    const towerInfo=document.getElementById('tower-info'),btnWave=document.getElementById('btn-wave'),btnPause=document.getElementById('btn-pause'),btnSpeed=document.getElementById('btn-speed'),btnSell=document.getElementById('btn-sell');
    const btnLaser=document.getElementById('btn-laser'),btnPlasma=document.getElementById('btn-plasma'),btnRailgun=document.getElementById('btn-railgun');
    const worldIndicator=document.getElementById('world-indicator');

    function updateUI(){
        if(!game)return;
        uiWave.textContent=game.wave;uiScore.textContent=game.score;uiCredits.textContent=game.credits;uiLives.textContent=game.lives;
        worldIndicator.textContent=`${game.world.emoji} ${game.world.name} — ${game.world.difficulty}`;
        if(game.worldComplete)btnWave.textContent='✿ Monde terminé !';
        else if(game.waveActive){btnWave.textContent=`🌊 Vague ${game.wave}...`;btnWave.classList.add('disabled');}
        else if(game.gameOver){btnWave.textContent='💔 Perdu...';btnWave.classList.add('disabled');}
        else{btnWave.textContent=`🌸 Vague ${game.wave+1}/${game.world.waves}`;btnWave.classList.remove('disabled');}
        for(const[type,btn]of[['laser',btnLaser],['plasma',btnPlasma],['railgun',btnRailgun]]){
            const d=TOWER_DEFS[type];btn.classList.toggle('disabled',game.credits<d.cost);btn.classList.toggle('active',game.placingTower===type);
        }
        btnPause.textContent=game.paused?'▶ Go':'⏸ Pause';
        btnSpeed.textContent=game.speed===2?'⏩ x2':'⏩ x1';
        if(game.selectedTower){const t=game.selectedTower;const sp=Math.floor(t.cost*.6);
            towerInfo.innerHTML=`<div class="info-title" style="color:${t.color}">${t.emoji} ${t.name}</div><div>💥 ${t.damage} · 🎯 ${t.range} · ⏱ ${(1/t.cooldown).toFixed(1)}/s</div>${t.aoeRadius?`<div>💫 Zone ${t.aoeRadius}px</div>`:''}${t.instant?'<div>⚡ Instantané</div>':''}`;
            btnSell.style.display='block';btnSell.textContent=`👋 Libérer (${sp}🍬)`;
        }else if(game.placingTower){const d=TOWER_DEFS[game.placingTower];
            towerInfo.innerHTML=`<div class="info-title" style="color:${d.color}">${d.emoji} ${d.name}</div><div>🍬 ${d.cost} · 💥 ${d.damage} · 🎯 ${d.range}</div><div style="color:#34d399;font-size:9px;">Clique pour placer ! 🌸</div>`;
            btnSell.style.display='none';
        }else{towerInfo.innerHTML='<span style="color:#6b7a99;">Choisis un ami ! ✿</span>';btnSell.style.display='none';}
    }

    // ==================== ÉVÉNEMENTS ====================
    function getCanvasCoords(e){const r=canvas.getBoundingClientRect();return{x:(e.clientX-r.left)*(CW/r.width),y:(e.clientY-r.top)*(CH/r.height)};}
    function setupGameEvents(){
        canvas.onclick=e=>{if(!game)return;const c=getCanvasCoords(e);game.handleClick(c.x,c.y);};
        canvas.onmousemove=e=>{if(!game)return;const c=getCanvasCoords(e);game.handleMouseMove(c.x,c.y);};
        canvas.onmouseleave=()=>{if(game){game.mouseX=-1;game.mouseY=-1;}};
        canvas.oncontextmenu=e=>{e.preventDefault();if(game){game.placingTower=null;game.selectedTower=null;updateUI();}};
        canvas.ontouchstart=e=>{e.preventDefault();if(!game)return;initAudio();resumeAudio();const t=e.touches[0];const c=getCanvasCoords(t);game.handleMouseMove(c.x,c.y);game.handleClick(c.x,c.y);};
        canvas.ontouchmove=e=>{e.preventDefault();if(!game)return;const t=e.touches[0];const c=getCanvasCoords(t);game.handleMouseMove(c.x,c.y);};
        canvas.ontouchend=()=>{if(game){game.mouseX=-1;game.mouseY=-1;}};
    }
    function selectTower(type){
        if(!game||game.gameOver)return;
        if(game.credits<TOWER_DEFS[type].cost){sfxError();return;}
        game.placingTower=game.placingTower===type?null:type;game.selectedTower=null;
        sfxClick();
        updateUI();
    }
    btnLaser.onclick=()=>{initAudio();resumeAudio();selectTower('laser');};
    btnPlasma.onclick=()=>{initAudio();resumeAudio();selectTower('plasma');};
    btnRailgun.onclick=()=>{initAudio();resumeAudio();selectTower('railgun');};
    btnWave.onclick=()=>{initAudio();resumeAudio();if(game&&!game.waveActive&&!game.gameOver&&!game.worldComplete)game.startWave();};
    btnPause.onclick=()=>{initAudio();resumeAudio();if(game&&!game.gameOver){game.paused=!game.paused;sfxClick();updateUI();}};
    btnSpeed.onclick=()=>{initAudio();resumeAudio();if(game){game.speed=game.speed===1?2:1;sfxClick();updateUI();}};
    btnSell.onclick=()=>{initAudio();resumeAudio();if(game&&game.selectedTower)game.sellTower(game.selectedTower);};
    document.getElementById('btn-menu-back').onclick=()=>{sfxClick();backToMenu();};
    document.onkeydown=e=>{
        if(!game)return;
        initAudio();resumeAudio();
        switch(e.key){
            case'1':selectTower('laser');break;case'2':selectTower('plasma');break;case'3':selectTower('railgun');break;
            case' ':case'p':case'P':e.preventDefault();if(!game.gameOver){game.paused=!game.paused;sfxClick();updateUI();}break;
            case'Escape':game.placingTower=null;game.selectedTower=null;sfxClick();updateUI();break;
            case's':case'S':game.speed=game.speed===1?2:1;sfxClick();updateUI();break;
            case'm':case'M':toggleGameMusic();break;
        }
    };

    // Initialiser l'audio au premier clic global (politique autoplay)
    document.addEventListener('click', function firstClick() {
        initAudio();
        resumeAudio();
        document.removeEventListener('click', firstClick);
    }, { once: true });

    // ==================== BOUCLE ====================
    let lastTs=0,gameLoopRunning=false;
    function startGameLoop(){gameLoopRunning=true;requestAnimationFrame(gameLoop);}
    function gameLoop(ts){const dt=Math.min((ts-lastTs)/1000,.1);lastTs=ts;if(game){game.update(dt);game.render();}requestAnimationFrame(gameLoop);}

    // ==================== DÉMARRAGE ====================
    buildWorldsMenu();
    updateMenuMusicBtn();
    </script>
</body>
</html>
