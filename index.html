       ~Ligne 30    → 🎨 CSS (styles + animations)
       ~Ligne 350   → 📋 REGISTRE DES JEUX (tableau GAMES)

       ~Ligne 900   → 🖥️ MOTEUR DU SITE (affichage, navigation)
     
     ═══════════════════════════════════════════════════════════════ -->

<style>
/* ══════════════════════════════════════════════════════════════
   🎨 STYLES & ANIMATIONS
   ══════════════════════════════════════════════════════════════ */

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --savry-50: #f0f4ff;  --savry-100: #dbe4ff;  --savry-200: #bac8ff;
  --savry-300: #91a7ff;  --savry-400: #748ffc;  --savry-500: #5c7cfa;
  --savry-600: #4c6ef5;  --savry-700: #4263eb;  --savry-800: #3b5bdb;
  --savry-900: #364fc7;
  --radius: 16px;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.08);
  --shadow-md: 0 4px 12px rgba(0,0,0,.1);
  --shadow-lg: 0 12px 40px rgba(0,0,0,.12);
  --shadow-xl: 0 20px 60px rgba(0,0,0,.15);
}

body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: linear-gradient(135deg, var(--savry-50) 0%, #fff 50%, #f5f0ff 100%);
  color: #1a1a2e;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
}

button { cursor: pointer; border: none; font-family: inherit; }
button:active { transform: scale(0.96); }

/* ─── Scrollbar ─── */
::-webkit-scrollbar { width: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--savry-300); border-radius: 99px; }

/* ─── Animations ─── */
@keyframes float { 0%,100%{ transform: translateY(0); } 50%{ transform: translateY(-8px); } }
@keyframes slideUp { from { opacity:0; transform:translateY(30px); } to { opacity:1; transform:translateY(0); } }
@keyframes scaleIn { from { opacity:0; transform:scale(.9); } to { opacity:1; transform:scale(1); } }
@keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
@keyframes pulse { 0%,100%{ transform:scale(1); } 50%{ transform:scale(1.15); } }
@keyframes shimmer { 0%{ background-position:-200% center; } 100%{ background-position:200% center; } }
@keyframes confetti { 0%{ transform:translateY(0) rotate(0); opacity:1; } 100%{ transform:translateY(-120px) rotate(360deg); opacity:0; } }

.animate-float { animation: float 3s ease-in-out infinite; }
.animate-slideUp { animation: slideUp .5s ease-out both; }
.animate-scaleIn { animation: scaleIn .3s ease-out both; }
.animate-fadeIn { animation: fadeIn .4s ease-out both; }
.animate-pulse { animation: pulse 1.5s ease-in-out infinite; }

/* ─── Header ─── */
.header {
  position: sticky; top: 0; z-index: 100;
  backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
  background: rgba(255,255,255,.82);
  border-bottom: 1px solid var(--savry-100);
  box-shadow: var(--shadow-sm);
}
.header-inner {
  max-width: 1100px; margin: 0 auto;
  padding: 12px 20px;
  display: flex; align-items: center; gap: 16px;
}
.header-logo { font-size: 28px; }
.header-title {
  font-size: 22px; font-weight: 900;
  background: linear-gradient(135deg, var(--savry-600), var(--savry-800));
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
.header-sub { font-size: 12px; color: #999; margin-top: -3px; font-weight: 500; }
.header-status {
  margin-left: auto; display: flex; align-items: center; gap: 6px;
  font-size: 12px; color: #aaa;
  background: #f5f5f5; border-radius: 99px; padding: 5px 12px;
}
.header-dot { width: 8px; height: 8px; border-radius: 50%; background: #51cf66; animation: pulse 2s infinite; }

.btn-back {
  display: flex; align-items: center; gap: 6px;
  color: var(--savry-600); font-weight: 600; font-size: 15px;
  background: var(--savry-50); border-radius: 12px; padding: 8px 16px;
  transition: all .2s;
}
.btn-back:hover { background: var(--savry-100); color: var(--savry-800); }
.btn-back .arrow { transition: transform .2s; }
.btn-back:hover .arrow { transform: translateX(-3px); }

.game-header-title { font-size: 18px; font-weight: 700; color: #333; }

/* ─── Hero ─── */
.hero { text-align: center; padding: 40px 20px 10px; }
.hero h2 { font-size: clamp(26px, 5vw, 38px); font-weight: 900; color: #1a1a2e; }
.hero p { color: #888; font-size: 16px; max-width: 450px; margin: 8px auto 0; line-height: 1.5; }
.hero-badge {
  display: inline-flex; align-items: center; gap: 8px;
  background: var(--savry-50); color: var(--savry-700);
  border-radius: 99px; padding: 8px 18px; margin-top: 16px;
  font-size: 14px; font-weight: 600;
}

/* ─── Grid ─── */
.games-grid {
  max-width: 1100px; margin: 30px auto;
  padding: 0 20px;
  display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 24px;
}

/* ─── Card ─── */
.game-card {
  background: #fff; border-radius: 24px;
  box-shadow: var(--shadow-md);
  overflow: hidden; text-align: left;
  transition: all .3s cubic-bezier(.25,.8,.25,1);
  width: 100%;
}
.game-card:hover { transform: translateY(-8px); box-shadow: var(--shadow-xl); }

.card-header {
  height: 130px; display: flex; align-items: center; justify-content: center;
  position: relative; overflow: hidden;
}
.card-header .emoji {
  font-size: 56px; transition: transform .3s; filter: drop-shadow(0 4px 8px rgba(0,0,0,.2));
  position: relative; z-index: 2;
}
.game-card:hover .card-header .emoji { transform: scale(1.25) rotate(-5deg); }
.card-header .circle1, .card-header .circle2 {
  position: absolute; border-radius: 50%; background: rgba(255,255,255,.12);
}
.card-header .circle1 { width: 80px; height: 80px; top: -20px; right: -20px; }
.card-header .circle2 { width: 60px; height: 60px; bottom: -15px; left: -15px; }

.card-body { padding: 18px 20px 22px; }
.card-body h3 { font-size: 18px; font-weight: 700; color: #333; transition: color .2s; }
.game-card:hover .card-body h3 { color: var(--savry-600); }
.card-body p { font-size: 14px; color: #888; margin-top: 4px; line-height: 1.4; }

.card-tags { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
.tag {
  font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 99px;
}
.tag-easy { background: #e6f9e8; color: #2b8a3e; }
.tag-medium { background: #fff9db; color: #e67700; }
.tag-hard { background: #ffe3e3; color: #c92a2a; }
.tag-players { background: var(--savry-50); color: var(--savry-600); }

.card-play {
  display: flex; align-items: center; gap: 6px; margin-top: 14px;
  font-size: 14px; font-weight: 600; color: var(--savry-500);
  opacity: 0; transition: opacity .3s;
}
.game-card:hover .card-play { opacity: 1; }
.card-play .play-arrow { transition: transform .2s; }
.game-card:hover .card-play .play-arrow { transform: translateX(4px); }

/* ─── Game Player ─── */
.game-player {
  max-width: 900px; margin: 24px auto;
  padding: 0 12px;
}
.game-player-header {
  display: flex; align-items: center; gap: 12px;
  padding: 0 8px; margin-bottom: 20px;
}
.game-player-header .gp-emoji { font-size: 32px; }
.game-player-header .gp-title { font-size: 20px; font-weight: 700; color: #333; }
.game-player-header .gp-desc { font-size: 13px; color: #999; }

.game-container {
  background: #fff; border-radius: 24px;
  box-shadow: var(--shadow-lg); border: 1px solid #f0f0f0;
  padding: 24px; display: flex; justify-content: center;
  overflow: hidden;
}

/* ─── Footer ─── */
.footer { text-align: center; padding: 50px 20px 30px; font-size: 13px; color: #ccc; }

/* ─── Jeux : utilitaires communs ─── */
.game-wrap { display: flex; flex-direction: column; align-items: center; gap: 20px; width: 100%; }

.stats-bar { display: flex; gap: 20px; text-align: center; flex-wrap: wrap; justify-content: center; }
.stat-box { border-radius: 16px; padding: 10px 22px; }
.stat-label { font-size: 12px; font-weight: 500; }
.stat-value { font-size: 28px; font-weight: 900; }

.btn-primary {
  padding: 10px 24px; border-radius: 14px; font-weight: 700; font-size: 15px;
  color: #fff; transition: all .2s; box-shadow: var(--shadow-md);
}
.btn-primary:hover { filter: brightness(1.1); transform: translateY(-1px); }

.btn-secondary {
  padding: 10px 24px; border-radius: 14px; font-weight: 600; font-size: 14px;
  background: #f0f0f0; color: #555; transition: all .2s;
}
.btn-secondary:hover { background: #e0e0e0; }

.btn-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }

.status-msg { font-size: 18px; font-weight: 700; min-height: 32px; text-align: center; }

/* ─── La Nuit du Président ─── */
.president-wrap {
  position: relative; width: 100%; max-width: 800px;
  aspect-ratio: 4/3; border-radius: 16px; overflow: hidden; margin: 0 auto;
  background: radial-gradient(circle at center, #3d0028 0%, #1a000d 100%);
  box-shadow: 0 0 50px rgba(255, 0, 85, 0.2);
}
.president-wrap canvas { display: block; width: 100%; height: 100%; }
.president-hud {
  position: absolute; top: 12px; left: 14px;
  font-family: 'Fredoka One', cursive; font-size: 1.1rem;
  color: #fff; pointer-events: none; text-shadow: 2px 2px 0 #000;
}
.president-record {
  position: absolute; top: 12px; right: 14px;
  font-family: 'Fredoka One', cursive; font-size: 0.95rem;
  color: #00f2ea; pointer-events: none;
}
.president-overlay {
  position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  display: flex; flex-direction: column; justify-content: center; align-items: center;
  background: rgba(45, 0, 24, 0.88); backdrop-filter: blur(5px); z-index: 10;
  text-align: center; transition: opacity 0.3s; font-family: 'Fredoka One', cursive;
  color: #fff; padding: 20px;
}
.president-overlay.phidden { opacity: 0; pointer-events: none; }
.president-overlay h3 {
  font-size: clamp(1.4rem, 5vw, 2.5rem); color: #00f2ea;
  text-shadow: 4px 4px 0px #ff0055; animation: float 3s infinite ease-in-out;
  margin-bottom: 8px;
}
.president-overlay p { font-size: clamp(0.8rem, 2.5vw, 1rem); margin-bottom: 8px; line-height: 1.5; max-width: 90%; }
.president-btn {
  background: linear-gradient(45deg, #ff0055, #ff5e62); border: none;
  padding: 12px 32px; font-size: clamp(1rem, 3vw, 1.3rem);
  font-family: 'Fredoka One', cursive; color: white; border-radius: 50px;
  cursor: pointer; box-shadow: 0 10px 20px rgba(255, 0, 85, 0.4);
  transition: transform 0.1s; margin-top: 8px;
}
.president-btn:active { transform: scale(0.95); }

/* ─── Responsive ─── */
@media (max-width: 480px) {
  .header-status { display: none; }
  .header-title { font-size: 18px; }
  .hero h2 { font-size: 24px; }
  .games-grid { gap: 16px; grid-template-columns: 1fr; }
  .card-play { opacity: 1; }
  .game-container { padding: 16px; }
  .stat-box { padding: 8px 16px; }
  .stat-value { font-size: 22px; }
}
</style>
</head>

<div id="app"></div>

<script>
/* ╔══════════════════════════════════════════════════════════════════╗
   ║                                                                ║
   ║  📋  REGISTRE DES JEUX                                         ║
   ║                                                                ║
   ║  Chaque jeu = un objet dans le tableau GAMES.                  ║
   ║  Le champ "render" est le nom de la fonction qui dessine       ║
   ║  le jeu dans le <div> passé en paramètre.                     ║
   ║                                                                ║
   ╚══════════════════════════════════════════════════════════════════╝ */

const GAMES = [
  {
    id: "president",
    title: "La Nuit du Président",
    description: "Incarnez Manu. Évitez les Fantômes de la Dette. Récupérez les Cœurs de Croissance !",
    emoji: "🏛️",
    gradient: "linear-gradient(135deg, #ff0055, #2d0018)",
    render: renderPresident,
    players: "1",
    difficulty: "Moyen",
  },

  {
    id: "kawaii_defense",
    title: "Kawaii Defense",
    description: "Défendez votre base contre des vagues d'ennemis dans un monde kawaii !",
    emoji: "🏰",
    gradient: "linear-gradient(135deg, #f06595, #845ef7)",
    players: "1",
    difficulty: "Moyen",
    external: "kawaii_defense.html",  // ← Lien vers le fichier HTML externe
  },

  /* ┌──────────────────────────────────────────────────────────────┐
     │                                                              │
     │  ★★★  ÉTAPE 1 : AJOUTER UN JEU ICI  ★★★                   │
     │                                                              │
     │  Copier-coller ce modèle (enlever les //) :                 │
     │                                                              │
     │  {                                                           │
     │    id: "mon-jeu",                                            │
     │    title: "Mon Super Jeu",                                   │
     │    description: "Description courte du jeu.",                │
     │    emoji: "🎯",                                              │
     │    gradient: "linear-gradient(135deg, #ff6b6b, #ee5a24)",   │
     │    render: renderMonSuperJeu,                                │
     │    players: "1-2",                                           │
     │    difficulty: "Facile",    // Facile | Moyen | Difficile    │
     │  },                                                          │
     │                                                              │
     │  Puis coder la fonction renderMonSuperJeu(container)         │
     │  → chercher « ÉTAPE 2 : CODER LE JEU ICI » plus bas        │
     │                                                              │
     └──────────────────────────────────────────────────────────────┘ */
];


/* ╔══════════════════════════════════════════════════════════════════╗
   ║                                                                ║
   ║  🎮  CODE DES JEUX                                             ║
   ║                                                                ║
   ║  Chaque jeu est une fonction : renderXxx(container)            ║
   ║  "container" est le <div> dans lequel dessiner le jeu.         ║
   ║  La fonction doit tout gérer : HTML, état, événements.        ║
   ║                                                                ║
   ╚══════════════════════════════════════════════════════════════════╝ */


/* ─────────────────────────────────────────────────────────────────
   🎮 JEU 4 : LA NUIT DU PRÉSIDENT (Kawaii Horror)
   ───────────────────────────────────────────────────────────────── */

function renderPresident(container) {
  let animationId = null;
  let frames = 0;
  let score = 0;
  let highScore = parseInt(localStorage.getItem('macron_horror_highscore')) || 0;
  let gameStatePres = 'MENU'; // MENU, PLAYING, GAMEOVER

  container.innerHTML = `
    <div class="president-wrap" id="pres-wrap">
      <canvas id="presCanvas"></canvas>
      <div class="president-hud">Croissance: <span id="pres-score">0</span>%</div>
      <div class="president-record">Record: <span id="pres-highscore">${highScore}</span>%</div>
      <div class="president-overlay" id="pres-start">
        <h3>LA NUIT DU PRÉSIDENT</h3>
        <p>Thème : Kawaii Horror</p>
        <p>Incarnez Manu. Évitez les Fantômes de la Dette.<br>Récupérez les Cœurs de Croissance.</p>
        <p style="font-size:0.8rem;color:#aaa;">Contrôles : Flèches / Toucher l'écran</p>
        <button class="president-btn" id="pres-start-btn">Lancer le Mandat</button>
      </div>
      <div class="president-overlay phidden" id="pres-gameover">
        <h3 style="color:#ff0055;text-shadow:4px 4px 0 #000;">DISSOLUTION !</h3>
        <p>Score Final : <span id="pres-final-score">0</span>%</p>
        <button class="president-btn" id="pres-restart-btn">Nouveau Quinquennat</button>
      </div>
    </div>
  `;

  const wrap = document.getElementById('pres-wrap');
  const canvas = document.getElementById('presCanvas');
  const ctx2d = canvas.getContext('2d');

  // ─── Audio Engine ───
  const PresAudio = {
    ctx: null,
    init() { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); },
    playTone(freq, type, duration, vol=0.1, slide=0) {
      if (!this.ctx) return;
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
      if (slide !== 0) osc.frequency.linearRampToValueAtTime(freq+slide, this.ctx.currentTime+duration);
      gain.gain.setValueAtTime(0, this.ctx.currentTime);
      gain.gain.linearRampToValueAtTime(vol, this.ctx.currentTime+0.05);
      gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime+duration);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(); osc.stop(this.ctx.currentTime+duration);
    },
    playCollect() { this.playTone(600,'sine',0.1,0.1,200); setTimeout(()=>this.playTone(900,'sine',0.2,0.1,0),100); },
    playGameOver() { this.playTone(200,'sawtooth',0.5,0.2,-150); setTimeout(()=>this.playTone(100,'square',0.5,0.2,-50),200); },
  };

  // ─── Resize ───
  let gW = 0, gH = 0;
  function presResize() {
    gW = wrap.clientWidth; gH = wrap.clientHeight;
    canvas.width = gW; canvas.height = gH;
  }
  presResize();
  const resizeHandler = () => presResize();
  window.addEventListener('resize', resizeHandler);

  // ─── Player ───
  const player = {
    size: 30, x: gW/2, y: gH/2, speed: 5, vx: 0, vy: 0, angle: 0,
    update() {
      if (presInput.keys['ArrowUp']||presInput.keys['z']||presInput.keys['Z']) this.vy = -this.speed;
      else if (presInput.keys['ArrowDown']||presInput.keys['s']||presInput.keys['S']) this.vy = this.speed;
      else this.vy = 0;
      if (presInput.keys['ArrowLeft']||presInput.keys['q']||presInput.keys['Q']) this.vx = -this.speed;
      else if (presInput.keys['ArrowRight']||presInput.keys['d']||presInput.keys['D']) this.vx = this.speed;
      else this.vx = 0;
      if (presInput.touch.active) {
        const dx = presInput.touch.x - this.x, dy = presInput.touch.y - this.y;
        const dist = Math.sqrt(dx*dx+dy*dy);
        if (dist > 5) { this.vx = (dx/dist)*this.speed; this.vy = (dy/dist)*this.speed; }
        else { this.vx = 0; this.vy = 0; }
      }
      this.x += this.vx; this.y += this.vy;
      if (this.x < this.size) this.x = this.size;
      if (this.x > gW-this.size) this.x = gW-this.size;
      if (this.y < this.size) this.y = this.size;
      if (this.y > gH-this.size) this.y = gH-this.size;
      this.angle += 0.05;
    },
    draw() {
      ctx2d.save(); ctx2d.translate(this.x, this.y);
      const grad = ctx2d.createRadialGradient(0,0,10,0,0,150);
      grad.addColorStop(0,'rgba(255,255,255,0.2)');
      grad.addColorStop(1,'rgba(0,0,0,0)');
      ctx2d.fillStyle = grad;
      ctx2d.beginPath(); ctx2d.arc(0,0,150,0,Math.PI*2); ctx2d.fill();
      ctx2d.fillStyle = '#091e38';
      ctx2d.beginPath(); ctx2d.arc(0,10,this.size-5,0,Math.PI*2); ctx2d.fill();
      ctx2d.fillStyle = '#ffdbac';
      ctx2d.beginPath(); ctx2d.arc(0,-5,this.size-8,0,Math.PI*2); ctx2d.fill();
      ctx2d.fillStyle = '#000';
      ctx2d.beginPath(); ctx2d.arc(-8,-5,3,0,Math.PI*2); ctx2d.arc(8,-5,3,0,Math.PI*2); ctx2d.fill();
      ctx2d.fillStyle = '#002654'; ctx2d.fillRect(-10,10,6,10);
      ctx2d.fillStyle = '#ffffff'; ctx2d.fillRect(-4,10,6,10);
      ctx2d.fillStyle = '#ed2939'; ctx2d.fillRect(2,10,6,10);
      ctx2d.restore();
    }
  };

  // ─── Enemies ───
  let enemies = [];
  function spawnEnemy() {
    const e = { size: 25, speed: 1.5+Math.random()*1.5, angle: 0 };
    if (Math.random()<0.5) { e.x = Math.random()<0.5 ? -50 : gW+50; e.y = Math.random()*gH; }
    else { e.x = Math.random()*gW; e.y = Math.random()<0.5 ? -50 : gH+50; }
    enemies.push(e);
  }
  function updateEnemy(e) {
    const dx = player.x-e.x, dy = player.y-e.y, dist = Math.sqrt(dx*dx+dy*dy);
    e.x += (dx/dist)*e.speed; e.y += (dy/dist)*e.speed; e.angle += 0.1;
  }
  function drawEnemy(e) {
    ctx2d.save(); ctx2d.translate(e.x, e.y); ctx2d.rotate(Math.sin(e.angle)*0.1);
    ctx2d.shadowBlur = 15; ctx2d.shadowColor = '#ff0055';
    ctx2d.fillStyle = '#ff0055';
    ctx2d.beginPath(); ctx2d.arc(0,-5,e.size,Math.PI,0);
    ctx2d.lineTo(e.size,15); ctx2d.lineTo(0,5); ctx2d.lineTo(-e.size,15); ctx2d.fill();
    ctx2d.strokeStyle = '#2d0018'; ctx2d.lineWidth = 3;
    ctx2d.beginPath(); ctx2d.moveTo(-10,-5); ctx2d.lineTo(-4,1); ctx2d.stroke();
    ctx2d.beginPath(); ctx2d.moveTo(-4,-5); ctx2d.lineTo(-10,1); ctx2d.stroke();
    ctx2d.beginPath(); ctx2d.moveTo(4,-5); ctx2d.lineTo(10,1); ctx2d.stroke();
    ctx2d.beginPath(); ctx2d.moveTo(10,-5); ctx2d.lineTo(4,1); ctx2d.stroke();
    ctx2d.shadowBlur = 0; ctx2d.fillStyle = 'rgba(255,255,255,0.5)';
    ctx2d.font = '10px sans-serif'; ctx2d.textAlign = 'center';
    ctx2d.fillText('€€€', 0, -35);
    ctx2d.restore();
  }

  // ─── Coins ───
  let coins = [];
  function spawnCoin() {
    coins.push({ x: Math.random()*(gW-40)+20, y: Math.random()*(gH-40)+20, size: 15, pulse: 0 });
  }
  function drawCoin(c) {
    c.pulse += 0.1;
    const sc = 1+Math.sin(c.pulse)*0.2;
    ctx2d.save(); ctx2d.translate(c.x, c.y); ctx2d.scale(sc, sc);
    ctx2d.fillStyle = '#00f2ea'; ctx2d.shadowBlur = 10; ctx2d.shadowColor = '#00f2ea';
    ctx2d.beginPath(); ctx2d.moveTo(0,5);
    ctx2d.bezierCurveTo(0,5,-10,-5,-10,-10); ctx2d.bezierCurveTo(-10,-15,-5,-15,0,-10);
    ctx2d.bezierCurveTo(5,-15,10,-15,10,-10); ctx2d.bezierCurveTo(10,-5,0,5,0,5);
    ctx2d.fill(); ctx2d.restore();
  }

  // ─── Particles ───
  let particles = [];
  function spawnParticles(x, y, color) {
    for (let i = 0; i < 15; i++) {
      particles.push({
        x, y, vx: (Math.random()-0.5)*8, vy: (Math.random()-0.5)*8,
        life: 1.0, color, size: Math.random()*5+2
      });
    }
  }
  function updateParticle(p) { p.x += p.vx; p.y += p.vy; p.life -= 0.02; p.vx *= 0.95; p.vy *= 0.95; }
  function drawParticle(p) {
    ctx2d.globalAlpha = Math.max(0, p.life);
    ctx2d.fillStyle = p.color;
    ctx2d.beginPath(); ctx2d.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx2d.fill();
    ctx2d.globalAlpha = 1.0;
  }

  // ─── Input ───
  const presInput = { keys: {}, touch: { x:0, y:0, active:false } };
  function presKeyDown(e) {
    if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key)) e.preventDefault();
    presInput.keys[e.key] = true;
  }
  function presKeyUp(e) { presInput.keys[e.key] = false; }
  window.addEventListener('keydown', presKeyDown);
  window.addEventListener('keyup', presKeyUp);

  canvas.addEventListener('touchstart', e => {
    e.preventDefault(); presInput.touch.active = true;
    const rect = canvas.getBoundingClientRect();
    presInput.touch.x = e.touches[0].clientX - rect.left;
    presInput.touch.y = e.touches[0].clientY - rect.top;
  }, {passive:false});
  canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    const rect = canvas.getBoundingClientRect();
    presInput.touch.x = e.touches[0].clientX - rect.left;
    presInput.touch.y = e.touches[0].clientY - rect.top;
  }, {passive:false});
  canvas.addEventListener('touchend', () => { presInput.touch.active = false; });

  // Also support mouse for desktop
  canvas.addEventListener('mousedown', e => {
    presInput.touch.active = true;
    const rect = canvas.getBoundingClientRect();
    presInput.touch.x = e.clientX - rect.left;
    presInput.touch.y = e.clientY - rect.top;
  });
  canvas.addEventListener('mousemove', e => {
    if (!presInput.touch.active) return;
    const rect = canvas.getBoundingClientRect();
    presInput.touch.x = e.clientX - rect.left;
    presInput.touch.y = e.clientY - rect.top;
  });
  canvas.addEventListener('mouseup', () => { presInput.touch.active = false; });

  // ─── Game Over ───
  function presGameOver() {
    gameStatePres = 'GAMEOVER';
    PresAudio.playGameOver();
    if (score > highScore) {
      highScore = score;
      localStorage.setItem('macron_horror_highscore', highScore);
      document.getElementById('pres-highscore').innerText = highScore;
    }
    document.getElementById('pres-final-score').innerText = score;
    document.getElementById('pres-gameover').classList.remove('phidden');
    canvas.style.transform = 'translate(5px, 5px)';
    setTimeout(() => canvas.style.transform = 'none', 100);
  }

  // ─── Init Game ───
  function presInitGame() {
    PresAudio.init();
    presResize();
    player.x = gW/2; player.y = gH/2; player.vx = 0; player.vy = 0;
    enemies = []; coins = []; particles = [];
    score = 0; frames = 0;
    spawnCoin();
    document.getElementById('pres-start').classList.add('phidden');
    document.getElementById('pres-gameover').classList.add('phidden');
    document.getElementById('pres-score').innerText = '0';
    gameStatePres = 'PLAYING';
    if (animationId) cancelAnimationFrame(animationId);
    presLoop();
  }

  // ─── Main Loop ───
  function presLoop() {
    if (gameStatePres !== 'PLAYING') return;
    ctx2d.fillStyle = 'rgba(45, 0, 24, 0.3)';
    ctx2d.fillRect(0, 0, gW, gH);
    frames++;
    player.update(); player.draw();

    if (frames % Math.max(20, 100-Math.floor(score/5)) === 0) spawnEnemy();

    enemies.forEach(e => {
      updateEnemy(e); drawEnemy(e);
      const dx = player.x-e.x, dy = player.y-e.y;
      if (Math.sqrt(dx*dx+dy*dy) < player.size+e.size-10) {
        spawnParticles(player.x, player.y, '#ff0055');
        presGameOver();
      }
    });

    coins.forEach((c, i) => {
      drawCoin(c);
      const dx = player.x-c.x, dy = player.y-c.y;
      if (Math.sqrt(dx*dx+dy*dy) < player.size+c.size) {
        score += 10;
        document.getElementById('pres-score').innerText = score;
        PresAudio.playCollect();
        spawnParticles(c.x, c.y, '#00f2ea');
        coins.splice(i, 1);
        spawnCoin();
      }
    });

    particles.forEach((p, i) => { updateParticle(p); drawParticle(p); if (p.life <= 0) particles.splice(i, 1); });

    animationId = requestAnimationFrame(presLoop);
  }

  // ─── Button bindings ───
  document.getElementById('pres-start-btn').addEventListener('click', presInitGame);
  document.getElementById('pres-restart-btn').addEventListener('click', presInitGame);

  // ─── Cleanup ───
  window.presidentCleanup = () => {
    if (animationId) cancelAnimationFrame(animationId);
    window.removeEventListener('keydown', presKeyDown);
    window.removeEventListener('keyup', presKeyUp);
    window.removeEventListener('resize', resizeHandler);
    gameStatePres = 'MENU';
  };
}

let currentView = "hub"; // "hub" ou l'id d'un jeu
const app = document.getElementById('app');

function navigate(view) {
  // Cleanup des jeux si on quitte
  if (currentView === 'president' && window.presidentCleanup) window.presidentCleanup();

  // Si le jeu est externe (fichier HTML séparé), on l'ouvre
  const game = GAMES.find(g => g.id === view);
  if (game && game.external) {
    window.location.href = game.external;
    return;
  }

  currentView = view;
  renderApp();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderApp() {
  if (currentView === "hub") {
    renderHub();
  } else {
    renderGamePlayer(currentView);
  }
}

function renderHub() {
  const diffClass = d => d === 'Facile' ? 'tag-easy' : d === 'Moyen' ? 'tag-medium' : 'tag-hard';

  app.innerHTML = `
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <div class="header-logo animate-float">🎮</div>
        <div>
          <div class="header-title">Les Savry</div>
          <div class="header-sub">Game Hub Familial</div>
        </div>
        <div class="header-status">
          <span class="header-dot"></span> En ligne
        </div>
      </div>
    </header>

    <!-- Hero -->
    <div class="hero animate-slideUp">
      <h2>🎲 Salle de Jeux 🎲</h2>
      <p>Bienvenue chez les Savry ! Choisis ton jeu et c'est parti pour le fun 🎉</p>
      <div class="hero-badge">
        <span style="font-size:18px;">🕹️</span>
        ${GAMES.length} jeu${GAMES.length > 1 ? 'x' : ''} disponible${GAMES.length > 1 ? 's' : ''}
      </div>
    </div>

    <!-- Games Grid -->
    ${GAMES.length > 0 ? `
    <div class="games-grid">
      ${GAMES.map((game, i) => `
        <button class="game-card animate-slideUp" style="animation-delay:${i*100}ms;animation-fill-mode:both;" data-game="${game.id}">
          <div class="card-header" style="background:${game.gradient};">
            <span class="emoji">${game.emoji}</span>
            <div class="circle1"></div>
            <div class="circle2"></div>
          </div>
          <div class="card-body">
            <h3>${game.title}</h3>
            <p>${game.description}</p>
            <div class="card-tags">
              <span class="tag ${diffClass(game.difficulty)}">${game.difficulty}</span>
              <span class="tag tag-players">👥 ${game.players} joueur${game.players !== '1' ? 's' : ''}</span>
            </div>
            <div class="card-play">
              <span>Jouer</span>
              <span class="play-arrow">→</span>
            </div>
          </div>
        </button>
      `).join('')}
    </div>` : `
    <div style="text-align:center;padding:80px 20px;color:#ccc;">
      <div style="font-size:60px;margin-bottom:16px;">🎮</div>
      <p style="font-size:18px;font-weight:600;">Aucun jeu pour le moment</p>
      <p style="font-size:14px;margin-top:4px;">Ajoutez un jeu dans le tableau GAMES !</p>
    </div>`}

    <!-- Footer -->
    <div class="footer">Fait avec ❤️ par la famille Savry</div>
  `;

  // Bind click events
  app.querySelectorAll('.game-card').forEach(card => {
    card.addEventListener('click', () => navigate(card.dataset.game));
  });
}

function renderGamePlayer(gameId) {
  const game = GAMES.find(g => g.id === gameId);
  if (!game) {
    app.innerHTML = `
      <div style="text-align:center;padding:100px 20px;">
        <div style="font-size:60px;margin-bottom:16px;">🤔</div>
        <h2 style="font-size:24px;font-weight:700;color:#555;">Jeu introuvable</h2>
        <button class="btn-primary" style="background:var(--savry-500);margin-top:20px;" onclick="navigate('hub')">← Retour</button>
      </div>
    `;
    return;
  }

  app.innerHTML = `
    <!-- Header -->
    <header class="header">
      <div class="header-inner">
        <button class="btn-back" onclick="navigate('hub')">
          <span class="arrow">←</span>
          <span>Retour</span>
        </button>
        <div class="game-header-title">${game.emoji} ${game.title}</div>
        <div class="header-status">
          <span class="header-dot"></span> En ligne
        </div>
      </div>
    </header>

    <!-- Game -->
    <div class="game-player animate-scaleIn">
      <div class="game-player-header">
        <span class="gp-emoji">${game.emoji}</span>
        <div>
          <div class="gp-title">${game.title}</div>
          <div class="gp-desc">${game.description}</div>
        </div>
        <span class="tag tag-players" style="margin-left:auto;">👥 ${game.players}</span>
      </div>
      <div class="game-container">
        <div id="game-mount" style="width:100%;"></div>
      </div>
    </div>
  `;

  const mount = document.getElementById('game-mount');
  game.render(mount);
}

// Make navigate global for onclick handlers
window.navigate = navigate;

// Start
renderApp();
